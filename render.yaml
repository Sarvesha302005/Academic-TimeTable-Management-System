services:
  # Backend
  - type: web
    name: timetable-backend
    env: docker
    plan: free
    rootDir: timetable-backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5050
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # Frontend
  - type: web
    name: timetable-frontend
    runtime: node
    plan: free
    rootDir: timetable-frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: timetable-backend
          type: web
          property: host