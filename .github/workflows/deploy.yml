name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["Automated Testing & CI/CD Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install Dependencies
      run: |
        cd timetable-backend && npm ci
        cd ../timetable-frontend && npm ci
    
    - name: Build Backend
      run: |
        cd timetable-backend
        npm run build 2>/dev/null || echo "No build script for backend"
    
    - name: Build Frontend
      run: |
        cd timetable-frontend
        npm run build
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: |
          timetable-frontend/dist/
          timetable-backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download Build Artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts
    
    - name: Deploy to Production
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      run: |
        echo "🚀 Starting deployment process..."
        # Add your deployment commands here
        # Example: ssh, docker push, etc.
        echo "✅ Deployment completed successfully!"
    
    - name: Notify Deployment
      if: success()
      run: |
        echo "✅ Application deployed successfully to production!"
    
    - name: Notify Failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        exit 1
