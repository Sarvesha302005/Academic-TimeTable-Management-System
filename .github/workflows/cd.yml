# =============================================================
# CD Pipeline – Continuous Deployment
# =============================================================
# Runs on push to main (after PR merge).
# Builds Docker images and pushes them to GitHub Container
# Registry (GHCR) using the built-in GITHUB_TOKEN.
# =============================================================

name: CD Pipeline

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT
          echo "sha=${SHA_SHORT}" >> $GITHUB_OUTPUT

      # ---- Backend Image ----
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./timetable-backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/timetable-backend:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/timetable-backend:${{ steps.meta.outputs.sha }}

      # ---- Frontend Image ----
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./timetable-frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/timetable-frontend:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/timetable-frontend:${{ steps.meta.outputs.sha }}
