# =============================================================
# Docker Compose – Academic Timetable Management System
# =============================================================
# By default uses MongoDB Atlas (from .env file).
# To use a local MongoDB instead, run with the local-db profile:
#
#   docker compose --profile local-db up -d --build
#
# Usage (Atlas – default):
#   docker compose up -d --build   # Backend + Frontend (Atlas DB)
#
# Usage (Local MongoDB):
#   docker compose --profile local-db up -d --build
#
# Other commands:
#   docker compose logs -f         # Follow logs
#   docker compose down            # Stop services
#   docker compose down -v         # Stop + delete data volume
# =============================================================

services:
  # ---- MongoDB (LOCAL – only starts with --profile local-db) ----
  mongodb:
    image: mongo:7
    container_name: timetable-mongodb
    restart: unless-stopped
    profiles: [ "local-db" ]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: timeTable
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Backend (Node.js + Python Scheduler) ----
  backend:
    build:
      context: ./timetable-backend
      dockerfile: Dockerfile
    container_name: timetable-backend
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      PORT: 5050
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/timeTable}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_use_a_long_random_string}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      PYTHON_EXECUTABLE: python3
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:5050/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })" ]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---- Frontend (Nginx serving React SPA) ----
  frontend:
    build:
      context: ./timetable-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5050/api
    container_name: timetable-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
    driver: local
